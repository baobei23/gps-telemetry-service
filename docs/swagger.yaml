basePath: /
definitions:
  http.BaseResponse:
    properties:
      data: {}
    type: object
  http.ErrorResponse:
    properties:
      error:
        example: Something went wrong
        type: string
    type: object
  http.PaginatedResponse:
    properties:
      data: {}
      pagination:
        $ref: '#/definitions/http.PaginationMeta'
    type: object
  http.PaginationMeta:
    properties:
      limit:
        type: integer
      nextCursor:
        type: string
    type: object
  telemetry.DeviceSummary:
    properties:
      firstSeenAt:
        type: string
      id:
        type: string
      lastSeenAt:
        type: string
      status:
        description: '"active" or "inactive"'
        type: string
    type: object
  telemetry.Position:
    properties:
      accuracy:
        type: number
      altitude:
        type: number
      batt:
        type: number
      bearing:
        type: number
      charge:
        type: boolean
      deviceId:
        type: string
      deviceTime:
        type: string
      hdop:
        type: number
      id:
        type: integer
      lat:
        type: number
      lon:
        type: number
      serverTime:
        type: string
      speed:
        type: number
      valid:
        type: integer
    type: object
info:
  contact:
    email: reginaldsaja98@gmail.com
    name: API Support
    url: https://github.com/baobei23
  description: HTTP API for ingesting GPS positions using the Traccar OsmAnd query
    parameter format.
  title: GPS Telemetry Ingestion API
  version: 1.0.0
paths:
  /:
    get:
      description: Accepts a GPS position as OsmAnd query parameters. A successful
        request is acknowledged with an empty 200 response after the position has
        been persisted. Repeated device ID and timestamp pairs are ignored.
      parameters:
      - description: Device identifier (up to 32 characters)
        in: query
        name: id
        required: true
        type: string
      - description: Device timestamp as Unix epoch seconds
        format: int64
        in: query
        name: timestamp
        required: true
        type: integer
      - description: Latitude in decimal degrees (-90 to 90)
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude in decimal degrees (-180 to 180)
        in: query
        name: lon
        required: true
        type: number
      - description: Position validity (0 or 1; defaults to 1)
        in: query
        name: valid
        type: integer
      - description: Speed in knots (non-negative)
        in: query
        name: speed
        type: number
      - description: Bearing in degrees (0 to 360)
        in: query
        name: bearing
        type: number
      - description: Altitude in metres
        in: query
        name: altitude
        type: number
      - description: Horizontal accuracy in metres (non-negative)
        in: query
        name: accuracy
        type: number
      - description: Horizontal dilution of precision (non-negative)
        in: query
        name: hdop
        type: number
      - description: Battery level (0 to 100)
        in: query
        name: batt
        type: number
      - description: Whether the device is charging
        in: query
        name: charge
        type: boolean
      responses:
        "200":
          description: Position persisted or duplicate ignored; empty response body
        "400":
          description: Invalid or missing query parameter
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Unexpected persistence error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Ingest a GPS position
      tags:
      - Telemetry
  /api/devices:
    get:
      description: Retrieves all tracked GPS devices with first/last seen timestamps
        and activity status.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/telemetry.DeviceSummary'
                  type: array
              type: object
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List tracked devices
      tags:
      - Devices
  /api/devices/{id}/latest:
    get:
      description: Retrieves the most recent GPS fix reported by the specified device
        ID.
      parameters:
      - description: Device identifier
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/telemetry.Position'
              type: object
        "400":
          description: Device ID is required
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Get latest device position
      tags:
      - Devices
  /api/devices/{id}/positions:
    get:
      description: Retrieves paginated GPS position history for a device within an
        optional time range using keyset cursor pagination.
      parameters:
      - description: Device identifier
        in: path
        name: id
        required: true
        type: string
      - description: Start timestamp in RFC3339 format
        in: query
        name: from
        type: string
      - description: End timestamp in RFC3339 format
        in: query
        name: to
        type: string
      - description: Page size limit (1-100, default 50)
        in: query
        name: limit
        type: integer
      - description: Opaque cursor token for next page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/http.PaginatedResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/telemetry.Position'
                  type: array
              type: object
        "400":
          description: Invalid query parameter format or range
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "404":
          description: Device not found
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: List position history
      tags:
      - Devices
  /health/live:
    get:
      description: Returns 200 OK if the service process is alive.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Liveness probe
      tags:
      - Health
  /health/ready:
    get:
      description: Returns 200 OK if the service is ready to accept traffic and dependent
        database is reachable. Returns 503 during shutdown or DB outage.
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
        "503":
          description: Service Unavailable
          schema:
            type: string
      summary: Readiness probe
      tags:
      - Health
swagger: "2.0"
