basePath: /
definitions:
  http.ErrorResponse:
    properties:
      error:
        example: Something went wrong
        type: string
    type: object
info:
  contact:
    email: reginaldsaja98@gmail.com
    name: API Support
    url: https://github.com/baobei23
  description: HTTP API for ingesting GPS positions using the Traccar OsmAnd query
    parameter format.
  title: GPS Telemetry Ingestion API
  version: 1.0.0
paths:
  /:
    get:
      description: Accepts a GPS position as OsmAnd query parameters. A successful
        request is acknowledged with an empty 200 response after the position has
        been persisted. Repeated device ID and timestamp pairs are ignored.
      parameters:
      - description: Device identifier (up to 32 characters)
        in: query
        name: id
        required: true
        type: string
      - description: Device timestamp as Unix epoch seconds
        format: int64
        in: query
        name: timestamp
        required: true
        type: integer
      - description: Latitude in decimal degrees (-90 to 90)
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude in decimal degrees (-180 to 180)
        in: query
        name: lon
        required: true
        type: number
      - description: Position validity (0 or 1; defaults to 1)
        in: query
        name: valid
        type: integer
      - description: Speed in knots (non-negative)
        in: query
        name: speed
        type: number
      - description: Bearing in degrees (0 to 360)
        in: query
        name: bearing
        type: number
      - description: Altitude in metres
        in: query
        name: altitude
        type: number
      - description: Horizontal accuracy in metres (non-negative)
        in: query
        name: accuracy
        type: number
      - description: Horizontal dilution of precision (non-negative)
        in: query
        name: hdop
        type: number
      - description: Battery level (0 to 100)
        in: query
        name: batt
        type: number
      - description: Whether the device is charging
        in: query
        name: charge
        type: boolean
      responses:
        "200":
          description: Position persisted or duplicate ignored; empty response body
        "400":
          description: Invalid or missing query parameter
          schema:
            $ref: '#/definitions/http.ErrorResponse'
        "500":
          description: Unexpected persistence error
          schema:
            $ref: '#/definitions/http.ErrorResponse'
      summary: Ingest a GPS position
      tags:
      - Telemetry
swagger: "2.0"
