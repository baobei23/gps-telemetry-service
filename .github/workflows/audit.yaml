name: Audit & Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # STAGE 1: CODE QUALITY & AUDIT
  # ============================================================================
  audit:
    name: "audit:quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Code Quality & Vet
        run: go vet ./...

      - name: Install and run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Run Unit Tests (with Race Detector)
        run: go test -v -race ./...

      - name: Verify Build
        run: go build -v ./...

  # ============================================================================
  # STAGE 2: SECURITY SCAN
  # ============================================================================
  security_scan:
    name: "security:scan"
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Filesystem & Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "0" # Laporkan temuan kerentanan
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Set up Go for Govulncheck
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: Run Official Go Security Scanner (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
