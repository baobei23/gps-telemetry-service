services:
  postgres:
    image: 'postgres:17-alpine'
    container_name: goapp_postgres
    restart: always
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    deploy:
      resources:
        limits:
          memory: 350M
    networks:
      goapp_prod_net:
        aliases:
          - postgres

  # --------------------------------------------------------------------------
  # STAGING ENVIRONMENT (Auto-deployed on CI)
  # --------------------------------------------------------------------------
  goapp_staging:
    image: ${IMAGE_STAGING:-ghcr.io/baobei23/goapp:staging}
    container_name: goapp_staging
    restart: always
    env_file:
      - .env.staging
    ports:
      - '127.0.0.1:8081:8080'
      - '127.0.0.1:2001:2000'
      - '127.0.0.1:9091:9090'
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 120M
    networks:
      - goapp_prod_net

  # --------------------------------------------------------------------------
  # PRODUCTION ENVIRONMENT (Blue Deployment - Manual Gate)
  # --------------------------------------------------------------------------
  goapp_prod:
    image: ${IMAGE_PROD:-ghcr.io/baobei23/goapp:latest}
    container_name: goapp_prod
    restart: always
    env_file:
      - .env.production
    ports:
      - '127.0.0.1:8080:8080'
      - '127.0.0.1:2000:2000'
      - '127.0.0.1:9090:9090'
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 150M
    networks:
      - goapp_prod_net

networks:
  goapp_prod_net:
    name: goapp_prod_net
    driver: bridge

volumes:
  postgres_data:
